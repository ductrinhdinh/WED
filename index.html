<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Photo Gallery</title>
	<link rel="stylesheet" href="css/gallery.css">
	<script src="js/gallery.js"></script>
</head>

<body onload="addTabFocus()">

	<div id="image">
		Hover over an image below to display here.
	</div>

	<img class="preview" alt="Bacon in the woods" src="images/bacon_in_the_woods.png" onmouseover="upDate(this)"
		onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Bacon near the fort" src="images/bacon_near_the_fort.png" onmouseover="upDate(this)"
		onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" src="images\BaconGallupPark.jpg" alt="Bacon at Gallup Park" onmouseover="upDate(this)"
		onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Bend in the road" src="images/bend_in_the_road.png" onmouseover="upDate(this)"
		onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Falling petals" src="images/falling_petals.png" onmouseover="upDate(this)"
		onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" src="images/hanging_plants.png" alt="Hanging plants" onmouseover="upDate(this)"
		onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
</body>

</html>
